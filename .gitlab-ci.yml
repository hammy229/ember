# Runs when this repo is mirrored to GitLab. Keep it in step with .github/workflows/ci.yml.
stages:
  - format
  - test
  - web

format:
  stage: format
  image: python:3.13
  script:
    - pip install clang-format==18.1.8
    - git ls-files '*.h' '*.cpp' | xargs clang-format --dry-run --Werror

.native:
  stage: test
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - apt-get install -y cmake ninja-build g++ git
  script:
    - cmake --preset $PRESET
    - cmake --build --preset $PRESET
    - ctest --preset $PRESET

release:
  extends: .native
  variables:
    PRESET: release

sanitize:
  extends: .native
  variables:
    PRESET: sanitize

web:
  stage: web
  image: emscripten/emsdk:6.0.13
  before_script:
    - apt-get update
    - apt-get install -y ninja-build
  script:
    - ./scripts/build-wasm.sh
    - node tests/wasm_smoke.mjs
    - cd web
    - npm ci
    - npm run build
