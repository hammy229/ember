name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Free minutes are limited, so a new push cancels the older run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pinned because clang-format output changes between versions.
      - run: pipx install clang-format==18.1.8
      - run: git ls-files '*.h' '*.cpp' | xargs clang-format --dry-run --Werror

  native:
    strategy:
      fail-fast: false
      matrix:
        preset: [release, sanitize]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Milestone 1: tests/hf_reference_test.cpp checks the logits against Hugging Face's, and fails
    # rather than skips if the model is missing.
    env:
      EMBER_MODEL_DIR: ${{ github.workspace }}/models/tinyllama-15M
      EMBER_REQUIRE_MODEL: "1"
    steps:
      - uses: actions/checkout@v4
      # The model is 30 MB from Hugging Face. fetch-model.sh pins every file's hash, so its own
      # hash is a safe cache key: a new pin means a new download.
      - name: Cache the test model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch-model.sh') }}
      - run: ./scripts/fetch-model.sh
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      # ctest hides output from passing tests. This puts each platform's measured margin in the log.
      - name: Show the difference from Hugging Face
        run: ./build/${{ matrix.preset }}/ember_tests --gtest_filter='HfReferenceTest.*' | grep -E "largest|PASSED"

  # Apple clang and ARM, next to GCC on x86 above. Free now that the repo is public.
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    # Milestone 1: tests/hf_reference_test.cpp checks the logits against Hugging Face's, and fails
    # rather than skips if the model is missing.
    env:
      EMBER_MODEL_DIR: ${{ github.workspace }}/models/tinyllama-15M
      EMBER_REQUIRE_MODEL: "1"
    steps:
      - uses: actions/checkout@v4
      # The model is 30 MB from Hugging Face. fetch-model.sh pins every file's hash, so its own
      # hash is a safe cache key: a new pin means a new download.
      - name: Cache the test model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch-model.sh') }}
      - run: ./scripts/fetch-model.sh
      - name: Install Ninja
        run: brew install ninja
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release
      # ctest hides output from passing tests. This puts each platform's measured margin in the log.
      - name: Show the difference from Hugging Face
        run: ./build/release/ember_tests --gtest_filter='HfReferenceTest.*' | grep -E "largest|PASSED"

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # libFuzzer comes with clang. GCC has no equivalent.
      - name: Install Ninja and clang
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - run: CXX=clang++ cmake --preset fuzz
      - run: cmake --build --preset fuzz
      - name: Fuzz each target for a minute
        run: |
          cd build/fuzz
          ./ember_fuzz_seeds seeds
          mkdir -p corpus/json corpus/safetensors
          ./ember_fuzz_json -max_total_time=60 -max_len=4096 corpus/json seeds/json
          ./ember_fuzz_safetensors -max_total_time=60 -max_len=8192 corpus/safetensors seeds/safetensors
      - name: Keep any input that crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/crash-*
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The smoke test also generates text in WebAssembly and compares it with the native build.
      EMBER_MODEL_DIR: ${{ github.workspace }}/models/tinyllama-15M
    steps:
      - uses: actions/checkout@v4
      - name: Cache the test model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch-model.sh') }}
      - run: ./scripts/fetch-model.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # Keep in step with .gitlab-ci.yml.
          version: 6.0.13
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: ./scripts/build-wasm.sh
      - run: node tests/wasm_smoke.mjs
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
