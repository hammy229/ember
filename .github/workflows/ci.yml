name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Free minutes are limited, so a new push cancels the older run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pinned because clang-format output changes between versions.
      - run: pipx install clang-format==18.1.8
      - run: git ls-files '*.h' '*.cpp' | xargs clang-format --dry-run --Werror

  native:
    strategy:
      fail-fast: false
      matrix:
        preset: [release, sanitize]
    # Linux only while the repo is private: macOS minutes count 10x against the free allowance.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # Keep in step with .gitlab-ci.yml.
          version: 6.0.13
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: ./scripts/build-wasm.sh
      - run: node tests/wasm_smoke.mjs
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
